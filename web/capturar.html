<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Origen — captura de parcelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
 :root{--pine:#0B3D2E;--leaf:#2E8B5E;--gold:#C2A04C;--ivory:#F5F2EB;--ink:#16211B;--line:#E3DECF}
 *{box-sizing:border-box}
 body{font-family:system-ui,-apple-system,sans-serif;margin:0;color:var(--ink);background:var(--ivory)}
 header{background:var(--pine);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:9}
 header .logo{background:var(--ivory);border-radius:9px;padding:4px;line-height:0}
 header .wm{font-family:'Sora',system-ui,sans-serif;font-weight:600;font-size:18px;letter-spacing:-.3px}
 header .sub{font-size:12px;opacity:.8}
 .dot{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.18);margin-left:auto}
 main{max-width:560px;margin:0 auto;padding:14px}
 .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
 h3{font-family:'Sora',system-ui,sans-serif;margin:0 0 6px;font-size:16px}
 label{display:block;font-size:13px;color:#5b5f58;margin:10px 0 4px}
 input,select{width:100%;padding:11px;font-size:16px;border:1px solid #cfcabb;border-radius:9px;background:#fff}
 button{width:100%;padding:13px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--pine);color:#fff;margin-top:12px;font-family:'Sora',system-ui,sans-serif}
 button.sec{background:#fff;color:var(--pine);border:1.5px solid var(--pine)}
 .gps{font-size:14px;background:#eef4ef;border:1px solid #d6e4da;border-radius:9px;padding:10px;margin-top:8px;color:#0a5236}
 .row{display:flex;gap:8px}.row>div{flex:1}
 .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #eee;font-size:14px}
 .b{font-size:12px;padding:4px 10px;border-radius:20px;white-space:nowrap;font-weight:500}
 .pend{background:#f6efdb;color:#8a6d18}.ok{background:#e6f3ea;color:#0a5236}.hi{background:#fae9e7;color:#b23a2b}.rev{background:#f6efdb;color:#8a6d18}
 img.prev{width:100%;border-radius:9px;margin-top:8px}
 .muted{color:#8a8d85;font-size:13px}
</style></head><body>
<header>
  <span class="logo"><svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
    <path d="M32 6C20.4 6 11 15 11 26.2 11 40 32 58 32 58s21-18 21-31.8C53 15 43.6 6 32 6z" fill="#0B3D2E"/>
    <path d="M32 41V27" stroke="#EAF3EC" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 31c-5 0-9-3-9.5-8 5.5 0 9 2.5 9.5 8z" fill="#C2A04C"/>
    <path d="M32 28c5 0 9-3 9.5-8-5.5 0-9 2.5-9.5 8z" fill="#2E8B5E"/></svg></span>
  <span class="wm">Origen</span><span class="sub">captura</span>
  <span class="dot" id="net">●</span>
</header>
<main>
  <div class="card">
    <label>Cooperativa</label>
    <input id="coop" placeholder="Nombre de la cooperativa">
  </div>
  <div class="card">
    <h3>Nueva parcela</h3>
    <label>Productor</label>
    <input id="prod" placeholder="Nombre del productor">
    <div class="row">
      <div><label>Producto</label>
        <select id="com"><option value="coffee">Café</option><option value="cacao">Cacao</option></select></div>
      <div><label>Área (ha)</label><input id="area" type="number" inputmode="decimal" placeholder="ej. 2"></div>
    </div>
    <button class="sec" id="gps">Capturar ubicación GPS</button>
    <div class="gps" id="gpsout" style="display:none"></div>
    <label>Foto del predio (opcional)</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <img class="prev" id="prev" style="display:none" alt="">
    <button id="save">Guardar parcela</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b id="qtitle">Parcelas (0)</b>
      <button class="sec" style="width:auto;margin:0;padding:9px 14px" id="sync">Sincronizar</button>
    </div>
    <div id="list"></div>
    <p class="muted" id="hint">Las parcelas se guardan en tu teléfono y se envían solas cuando hay señal.</p>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let coords=null, photo=null;
let queue=JSON.parse(localStorage.getItem('origen_queue')||'[]');
$('coop').value=localStorage.getItem('origen_coop')||'';
$('coop').oninput=()=>localStorage.setItem('origen_coop',$('coop').value);
const save=()=>localStorage.setItem('origen_queue',JSON.stringify(queue));
function netUI(){const o=navigator.onLine;$('net').textContent=o?'en línea':'sin señal';$('net').style.background=o?'rgba(255,255,255,.18)':'rgba(0,0,0,.3)';}
addEventListener('online',()=>{netUI();sync();});addEventListener('offline',netUI);netUI();

$('gps').onclick=()=>{
  if(!navigator.geolocation){alert('Tu teléfono no permite GPS en el navegador');return;}
  $('gps').textContent='Obteniendo ubicación…';
  navigator.geolocation.getCurrentPosition(p=>{
    coords={lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)};
    $('gpsout').style.display='block';
    $('gpsout').textContent='✓ '+coords.lat.toFixed(5)+', '+coords.lon.toFixed(5)+'  (±'+coords.acc+' m)';
    $('gps').textContent='Volver a capturar ubicación';
  },e=>{$('gps').textContent='Capturar ubicación GPS';alert('No se pudo obtener GPS: '+e.message);},
  {enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

$('photo').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const max=640,s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photo=c.toDataURL('image/jpeg',0.6);$('prev').src=photo;$('prev').style.display='block';
  };
  img.src=URL.createObjectURL(f);
};

$('save').onclick=()=>{
  if(!coords){alert('Primero captura la ubicación GPS, parado en la parcela');return;}
  if(!$('prod').value.trim()){alert('Pon el nombre del productor');return;}
  queue.push({id:Date.now(),producer:$('prod').value.trim(),cooperative:$('coop').value.trim(),
    commodity:$('com').value,area_ha:parseFloat($('area').value)||null,
    lat:coords.lat,lon:coords.lon,photo_base64:photo,status:'pendiente'});
  save();render();
  $('prod').value='';$('area').value='';photo=null;coords=null;
  $('prev').style.display='none';$('gpsout').style.display='none';$('gps').textContent='Capturar ubicación GPS';
  if(navigator.onLine)sync();
};

function render(){
  $('qtitle').textContent='Parcelas ('+queue.length+')';
  const pend=queue.filter(i=>i.status==='pendiente').length;
  $('sync').textContent=pend?('Sincronizar ('+pend+')'):'Sincronizado';
  $('list').innerHTML=queue.slice().reverse().map(i=>{
    let b='<span class="b pend">Pendiente</span>';
    if(i.status==='enviado'){
      if(i.risk==='high')b='<span class="b hi">deforestación</span>';
      else if(i.risk==='review')b='<span class="b rev">revisar</span>';
      else if(i.risk)b='<span class="b ok">limpio</span>';
      else b='<span class="b ok">enviado</span>';
    }
    return '<div class="item"><div>'+i.producer+'<div class="muted">'+i.lat.toFixed(4)+', '+i.lon.toFixed(4)+'</div></div>'+b+'</div>';
  }).join('');
}

async function sync(){
  if(!navigator.onLine)return;
  for(const i of queue){
    if(i.status!=='pendiente')continue;
    try{
      const r=await fetch('/capture',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({producer:i.producer,cooperative:i.cooperative,commodity:i.commodity,
          area_ha:i.area_ha,lat:i.lat,lon:i.lon,photo_base64:i.photo_base64})});
      if(!r.ok)continue;
      const d=await r.json(); i.lot_id=d.lot_id; i.status='enviado'; i.photo_base64=null; save(); render();
      try{const p=await (await fetch('/lots/'+d.lot_id+'/process',{method:'POST'})).json(); i.risk=p.overall_risk; save(); render();}catch(e){}
    }catch(e){}
  }
}
render(); if(navigator.onLine)sync();
</script>
</body></html>
